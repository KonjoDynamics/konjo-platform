name: infra
on:
  pull_request: { paths: ['infra/**'] }
  push: { branches: [main], paths: ['infra/**'] }
permissions: { id-token: write, contents: read }
jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: What-if (pull requests) / deploy (main)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            az deployment group what-if -g rg-konjo-dev -f infra/main.bicep -p infra/dev.bicepparam
          else
            az deployment group create -g rg-konjo-dev -f infra/main.bicep -p infra/dev.bicepparam
          fi
